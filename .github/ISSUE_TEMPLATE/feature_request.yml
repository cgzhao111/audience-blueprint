name: Feature request
description: Propose a reusable, evidence-safe improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Describe the user problem before prescribing an implementation. Do not include credentials, private catalog metadata, customer records, or internal URLs."

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dify workflow compatibility
        - Catalog validation or import
        - Evidence-state validation
        - Marketing scenario or strategy pack
        - Documentation or onboarding
        - Testing or release tooling
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What tested public use case is not covered today, and who experiences the problem?
    validations:
      required: true

  - type: textarea
    id: current_workaround
    attributes:
      label: Current workaround
      description: Optional. Explain how you handle the problem today.

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Evidence that would show the feature works
      description: Prefer a synthetic fixture, golden case, compatibility report, or deterministic assertion.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Include a smaller or provider-neutral option if one exists.

  - type: checkboxes
    id: data
    attributes:
      label: Safety and scope
      options:
        - label: The proposal can be demonstrated with synthetic or explicitly licensed data.
          required: true
        - label: The proposal does not require automatic audience counting, segment creation, or campaign delivery; otherwise I have clearly marked that it needs a separate design and security review.
          required: true
        - label: I am not presenting an untested compatibility claim or estimated adoption metric as fact.
          required: true

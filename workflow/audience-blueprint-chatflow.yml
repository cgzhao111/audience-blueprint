        prompt_template:
        - id: 993b2f1d-0508-4a44-8071-06cd2e5183a8
          role: system
          text: |
            你是营销圈人配置顾问的意图与槽位提取器，只负责理解，不负责生成标签。

            intent 只能是：
            - NEW_PLAN：新建圈人方案
            - MODIFY_PLAN：扩大、收窄、调整条件、修改排除或修改时间窗
            - EXPLAIN：解释上一方案或某个配置条件
            - OTHER：与营销圈人配置无关

            slots 只允许包含：scenario、goal、region、activity_start、activity_end、channel、benefit、brand、store、audience_count。
            没有明确提供的字段使用空字符串，不得猜测。audience_count 只能为 1 到 4；用户没有明确提出人群组数/层数时必须为空字符串。
            不要在 slots 中保存手机号、邮箱、证件号、会员号或用户明细。

            严格输出 JSON，不要输出解释：
            {"intent":"NEW_PLAN|MODIFY_PLAN|EXPLAIN|OTHER","slots":{"scenario":"","goal":"","region":"","activity_start":"","activity_end":"","channel":"","benefit":"","brand":"","store":"","audience_count":""},"modification":""}
        - id: 75559a20-5004-4ca8-b5bf-2ffc8b006c2e
          role: user
          text: |
            上一次活动背景：{{#conversation.activity_context#}}
            上一次已校验方案：{{#conversation.last_plan#}}
            用户本轮输入：{{#sys.query#}}
        selected: false
        structured_output_enabled: false
        title: 营销意图与活动槽位提取
        type: llm
        variables: []
        vision: {enabled: false}
      height: 132
      id: '2000000000002'
      position: {x: -1270, y: 100}
      positionAbsolute: {x: -1270, y: 100}
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 242
    - data:
        code: |
          import json
          import re
          from datetime import date

          SLOT_KEYS = (
              "scenario", "goal", "region", "activity_start", "activity_end",
              "channel", "benefit", "brand", "store", "audience_count"
          )
          REQUIRED = ("scenario", "goal", "region", "activity_start", "activity_end", "channel", "benefit")
          INTENTS = {"NEW_PLAN", "MODIFY_PLAN", "EXPLAIN", "OTHER"}

          def load_object(value):
              if isinstance(value, dict):
                  return value
              if not isinstance(value, str) or not value.strip():
                  return {}
              text = value.strip()
              if text.startswith("```"):
                  text = re.sub(r"^```(?:json)?\s*|\s*```$", "", text, flags=re.I)
              try:
                  parsed = json.loads(text)
                  return parsed if isinstance(parsed, dict) else {}
              except Exception:
                  return {}

          def has_pii(text):
              value = str(text or "")
              patterns = (
                  r"(?<!\d)1[3-9]\d{9}(?!\d)",
                  r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}",
                  r"(?<!\d)[1-9]\d{5}(?:19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[\dXx](?!\d)",
                  r"(?i)(?:会员号|会员编号|会员\s*ID|member[_\s-]*id|open[_\s-]*id|openid|unionid)\s*[:：=]?\s*[A-Za-z0-9_-]{4,}",
              )
              return any(re.search(pattern, value) for pattern in patterns)

          def clean_text(value, limit=200):
              if value is None:
                  return ""
              text = re.sub(r"[\x00-\x1f\x7f]", " ", str(value)).strip()
              return text[:limit]

          def main(llm_output, previous_context, previous_plan, user_query):
              previous = load_object(previous_context)
              parsed = load_object(llm_output)
              intent = str(parsed.get("intent") or "OTHER").upper()
              if intent not in INTENTS:
                  intent = "OTHER"

              if has_pii(user_query):
                  return {
                      "gate": "PII_BLOCKED",
                      "intent": intent,
                      "context_json": json.dumps(previous, ensure_ascii=False),
                      "missing_fields": "",
                      "followup": "请删除手机号、邮箱、证件号、会员号或用户明细后，再描述营销目标。",
                      "knowledge_query": "",
                      "previous_plan": str(previous_plan or "{}"),
                  }

              incoming = parsed.get("slots") if isinstance(parsed.get("slots"), dict) else {}
              merged = {} if intent == "NEW_PLAN" else {
                  key: previous.get(key, "") for key in SLOT_KEYS
              }
              for key in SLOT_KEYS:
                  value = incoming.get(key)
                  if value not in (None, ""):
                      if key == "audience_count":
                          try:
                              merged[key] = max(1, min(4, int(value)))
                          except Exception:
                              merged[key] = 3
                      else:
                          merged[key] = clean_text(value)
              if intent == "NEW_PLAN" and not merged.get("audience_count"):
                  merged["audience_count"] = 3

              required = list(REQUIRED)
              scenario = clean_text(merged.get("scenario"))
              if scenario.upper() == "BRAND_PROMOTION" or any(keyword in scenario for keyword in ("品牌促销", "品牌活动", "品牌营销")):
                  required.append("brand")
              if scenario.upper() == "STORE_OPENING" or any(keyword in scenario for keyword in ("门店开业", "新店开业", "开业引流")):
                  required.append("store")
              missing = [key for key in required if not clean_text(merged.get(key))]
              date_issue = ""
              start_text = clean_text(merged.get("activity_start"))
              end_text = clean_text(merged.get("activity_end"))
              if re.fullmatch(r"\d{4}-\d{2}-\d{2}", start_text) and re.fullmatch(r"\d{4}-\d{2}-\d{2}", end_text):
                  try:
                      if date.fromisoformat(start_text) > date.fromisoformat(end_text):
                          date_issue = "活动结束日期不得早于开始日期"
                  except ValueError:
                      date_issue = "活动起止日期不是有效日历日期"
              if date_issue:
                  missing.append("activity_date_order")
              if intent == "OTHER":
                  gate = "OTHER"
              elif missing:
                  gate = "MISSING_REQUIRED"
              else:
                  gate = "READY_FOR_RETRIEVAL"

              labels = {
                  "scenario": "活动场景", "goal": "营销目标", "region": "区域",
                  "activity_start": "开始时间", "activity_end": "结束时间", "channel": "触达渠道",
                  "benefit": "核心利益点/权益", "brand": "活动品牌", "store": "目标门店名称或店号",
                  "activity_date_order": date_issue or "有效的活动起止日期"
              }
              followup = "请一次性补充：" + "、".join(labels[key] for key in missing) if missing else ""
              query_parts = [clean_text(merged.get(key)) for key in SLOT_KEYS if clean_text(merged.get(key))]
              modification = clean_text(parsed.get("modification"), 300)
              if modification:
                  query_parts.append(modification)

              return {
                  "gate": gate,
                  "intent": intent,
                  "context_json": json.dumps(merged, ensure_ascii=False),
                  "missing_fields": ",".join(missing),
                  "followup": followup,
                  "knowledge_query": " ".join(query_parts)[:1000],
                  "previous_plan": "{}" if intent == "NEW_PLAN" else str(previous_plan or "{}"),
              }
        code_language: python3
        desc: 解析模型 JSON，合并多轮上下文，拦截个人信息并集中生成缺失项追问
        outputs:
          context_json: {children: null, type: string}
          followup: {children: null, type: string}
          gate: {children: null, type: string}
          intent: {children: null, type: string}
          knowledge_query: {children: null, type: string}
          missing_fields: {children: null, type: string}
          previous_plan: {children: null, type: string}

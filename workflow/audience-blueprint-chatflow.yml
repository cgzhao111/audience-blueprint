    - data:
        code: |
          import json
          import re

          CONFIRMED_VALUES = {"CONFIRMED", "CONFIRMED_CONFIGURABLE", "已确认可配置"}
          PENDING_VALUES = {"PENDING", "NEEDS_CONFIRMATION", "配置前请确认"}

          def flatten_text(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value
              if isinstance(value, dict):
                  return "\n".join(flatten_text(item) for item in value.values())
              if isinstance(value, (list, tuple)):
                  return "\n".join(flatten_text(item) for item in value)
              return str(value)

          def field(block, name):
              match = re.search(r"(?im)^\s*" + re.escape(name) + r"\s*[:：]\s*(.*?)\s*$", block)
              return match.group(1).strip() if match else ""

          def field_exact(block, name):
              match = re.search(r"(?m)^\s*" + re.escape(name) + r"\s*[:：]\s*(.*?)\s*$", block)
              return match.group(1).strip() if match else ""

          def field_compat(block, lowercase_name, uppercase_name):
              return field_exact(block, lowercase_name) or field_exact(block, uppercase_name) or field(block, lowercase_name)

          def split_values(value):
              return [item.strip() for item in re.split(r"[,，、|]", value or "") if item.strip()]

          def parse_catalog(tag_hits):
              text = flatten_text(tag_hits)
              blocks = re.findall(r"TAG_RECORD_BEGIN(.*?)TAG_RECORD_END", text, flags=re.I | re.S)
              records = {}
              for block in blocks:
                  cf_id = (field(block, "record_id") or field(block, "CF_ID")).upper()
                  if not re.fullmatch(r"CF[A-Z0-9_-]+", cf_id):
                      continue
                  raw_status = field(block, "confirmation_status") or field(block, "STATUS")
                  if raw_status in CONFIRMED_VALUES:
                      status = "CONFIRMED"
                  elif raw_status in PENDING_VALUES:
                      status = "PENDING"
                  else:
                      status = "UNSUPPORTED"
                  name = field(block, "display_name") or field(block, "TAG_NAME") or cf_id
                  path_clue = field(block, "path_clue") or field(block, "PATH")
                  verified_path = field_compat(block, "verified_path", "VERIFIED_PATH")
                  path = verified_path or path_clue
                  operators = split_values(field_compat(block, "operators", "OPERATORS"))
                  resource_type_hint = field(block, "resource_type_hint") or field(block, "RESOURCE_TYPE")
                  verified_resource_type = field_compat(block, "verified_resource_type", "VERIFIED_RESOURCE_TYPE")
                  resource_type = verified_resource_type or resource_type_hint
                  version = field_compat(block, "version", "VERSION")
                  source_clue = field(block, "source_knowledge") or field(block, "source_seed") or field(block, "SOURCE")
                  verified_source = field_compat(block, "verified_source", "VERIFIED_SOURCE")
                  source = verified_source or source_clue
                  time_window_required_raw = field_compat(block, "time_window_required", "TIME_WINDOW_REQUIRED")
                  aggregations = split_values(field_compat(block, "aggregations", "AGGREGATIONS"))
                  required_metadata = {
                      "VERIFIED_PATH": verified_path,
                      "VERIFIED_RESOURCE_TYPE": verified_resource_type,
                      "OPERATORS": operators,
                      "VERIFIED_SOURCE": verified_source,
                      "VERSION": version,
                  }
                  if resource_type.lower() in ("event", "event_property"):
                      required_metadata["TIME_WINDOW_REQUIRED"] = time_window_required_raw
                      required_metadata["AGGREGATIONS"] = aggregations
                  missing_metadata = [key for key, value in required_metadata.items() if not value]
                  if status == "CONFIRMED" and missing_metadata:
                      status = "PENDING"
                  records[cf_id] = {
                      "cf_id": cf_id,
                      "name": name,
                      "path": path,
                      "path_clue": path_clue,
                      "verified_path": verified_path,
                      "status": status,
                      "operators": operators,
                      "values": split_values(field_compat(block, "values", "VALUES")),
                      "resource_type": resource_type,
                      "resource_type_hint": resource_type_hint,
                      "verified_resource_type": verified_resource_type,
                      "version": version,
                      "source": source,
                      "source_clue": source_clue,
                      "verified_source": verified_source,
                      "missing_metadata": missing_metadata,
                      "time_window_required": time_window_required_raw.lower() in ("true", "yes", "1", "是"),
                      "aggregations": aggregations,
                      "configuration_guidance": field(block, "configuration_guidance"),
                  }
              return records

          def load_plan(value):
              if isinstance(value, dict):
                  return value
              text = str(value or "").strip()
              if text.startswith("```"):
                  text = re.sub(r"^```(?:json)?\s*|\s*```$", "", text, flags=re.I)
              try:
                  parsed = json.loads(text)
                  return parsed if isinstance(parsed, dict) else {}
              except Exception:
                  return {}

          def md(value, limit=500):
              text = re.sub(r"[\x00-\x1f\x7f]", " ", str(value or "")).strip()[:limit]
              for char in ("\\", "`", "*", "_", "[", "]", "<", ">", "#", "|"):
                  text = text.replace(char, "\\" + char)
              return text

          def display_value(value):
              if isinstance(value, (list, tuple)):
                  return "、".join(md(item, 100) for item in value)
              if isinstance(value, dict):
                  return md(json.dumps(value, ensure_ascii=False), 300)
              return md(value, 300)

          def sanitize_claims(value, warnings, field_name):
              text = str(value or "")
              original = text
              text = re.sub(r"(?:预计|预估|约)?\s*(?:覆盖)?\s*\d+(?:\.\d+)?\s*(?:万)?人", "[未计算人数]", text)
              text = re.sub(r"已(?:创建人群|建群|触达|发送)", "尚未执行", text)
              text = re.sub(r"(?i)(?:转化率|ROI)\s*[:：=]?\s*\d+(?:\.\d+)?%?", "[未核验效果指标]", text)
              if text != original:
                  warnings.append(field_name + "含未经计算或未经执行验证的声明，已替换")
              return text

          def main(plan_text, tag_hits, allowed_cf_ids, previous_plan, intent, strategy_review_status, strategy_version):
              catalog = parse_catalog(tag_hits)
              strategy_allowed = set(re.findall(r"\bCF-\d{3}\b", str(allowed_cf_ids or "").upper()))
              plan = load_plan(plan_text)
              raw_audiences = plan.get("audiences") if isinstance(plan.get("audiences"), list) else []
              gaps = [str(item)[:300] for item in plan.get("capability_gaps", []) if str(item).strip()] if isinstance(plan.get("capability_gaps"), list) else []
              normalized_audiences = []
              confirmed_count = 0
              pending_count = 0
              safety_warnings = []

              for audience in raw_audiences[:4]:
                  if not isinstance(audience, dict):
                      continue
                  valid_conditions = []
                  conditions = audience.get("conditions") if isinstance(audience.get("conditions"), list) else []
                  for condition in conditions[:20]:
                      if not isinstance(condition, dict):
                          continue
                      cf_id = str(condition.get("cf_id") or "").upper().strip()
                      record = catalog.get(cf_id)
                      if not record:
                          if cf_id:
                              gaps.append("未在本轮标签召回中找到 " + cf_id)
                          continue
                      if not strategy_allowed or cf_id not in strategy_allowed:
                          gaps.append(cf_id + " 未进入本轮策略召回的允许清单")
                          continue
                      if record["status"] == "UNSUPPORTED":
                          gaps.append(record["name"] + " 当前资料不支持")
                          continue
                      operator = str(condition.get("operator") or "").strip()
                      if record["operators"] and operator not in record["operators"]:
                          gaps.append(record["name"] + " 的操作符“" + operator + "”未获资料支持")
                          continue
                      if record["values"]:
                          raw_values = condition.get("value", "")
                          candidate_values = raw_values if isinstance(raw_values, list) else [raw_values]
                          invalid_values = [str(value) for value in candidate_values if str(value) not in record["values"]]
                          if invalid_values:
                              gaps.append(record["name"] + " 的值“" + "、".join(invalid_values) + "”不在已核验可选值中")
                              continue
                      time_window = str(condition.get("time_window") or "").strip()
                      aggregation = str(condition.get("aggregation") or "").strip()
                      if record["time_window_required"] and not time_window:
                          gaps.append(record["name"] + " 缺少必填时间窗口")
                          continue
                      if record["aggregations"] and aggregation not in record["aggregations"]:
                          gaps.append(record["name"] + " 的聚合方式“" + aggregation + "”未获资料支持")
                          continue
                      item = {
                          "cf_id": cf_id,
                          "name": record["name"],
                          "path": record["path"],
                          "status": record["status"],
                          "source": record["source"],
                          "configuration_guidance": record["configuration_guidance"],
                          "missing_metadata": record["missing_metadata"],
                          "logic": "OR" if str(condition.get("logic") or "AND").upper() == "OR" else "AND",
                          "use": "exclude" if str(condition.get("use") or "include").lower() == "exclude" else "include",
                          "operator": operator,
                          "value": condition.get("value", ""),
                          "time_window": time_window,
                          "aggregation": aggregation,
                          "reason": sanitize_claims(condition.get("reason"), safety_warnings, "条件选择原因"),
                      }
                      valid_conditions.append(item)
                  include_signatures = set()
                  exclude_signatures = set()
                  for item in valid_conditions:
                      signature = (
                          item["cf_id"], item["operator"],
                          json.dumps(item["value"], ensure_ascii=False, sort_keys=True),
                          item["time_window"], item["aggregation"],
                      )
                      (exclude_signatures if item["use"] == "exclude" else include_signatures).add(signature)
                  conflicts = include_signatures & exclude_signatures
                  if conflicts:
                      conflict_ids = sorted({signature[0] for signature in conflicts})
                      gaps.append("同一人群的满足与排除条件冲突：" + "、".join(conflict_ids))
                      valid_conditions = [item for item in valid_conditions if (
                          item["cf_id"], item["operator"],
                          json.dumps(item["value"], ensure_ascii=False, sort_keys=True),
                          item["time_window"], item["aggregation"],
                      ) not in conflicts]
                  confirmed_count += sum(1 for item in valid_conditions if item["status"] == "CONFIRMED")
                  pending_count += sum(1 for item in valid_conditions if item["status"] == "PENDING")
                  if valid_conditions:
                      normalized_audiences.append({
                          "name": sanitize_claims(audience.get("name") or "人群方案", safety_warnings, "人群名称"),
                          "positioning": sanitize_claims(audience.get("positioning"), safety_warnings, "人群定位"),
                          "reason": sanitize_claims(audience.get("reason"), safety_warnings, "推荐理由"),
                          "conditions": valid_conditions,
                      })

              sanitized_summary = sanitize_claims(plan.get("summary"), safety_warnings, "需求理解")
              sanitized_notes = [sanitize_claims(item, safety_warnings, "业务注意事项") for item in plan.get("notes", [])[:10]] if isinstance(plan.get("notes"), list) else []

              if not catalog or not strategy_allowed or not normalized_audiences:
                  status = "UNSUPPORTED"
              elif str(strategy_review_status or "").upper() != "APPROVED" or pending_count or gaps or safety_warnings:
                  status = "NEEDS_CONFIRMATION"
              else:
                  status = "CONFIRMED_CONFIGURABLE"

              versions = sorted({record["version"] for record in catalog.values() if record["version"]} | ({str(strategy_version)} if str(strategy_version or "").strip() else set()))
              knowledge_version = ", ".join(versions)
              normalized = {
                  "summary": sanitized_summary,
                  "audiences": normalized_audiences,
                  "capability_gaps": sorted(set(gaps)),
                  "notes": sanitized_notes,
                  "safety_warnings": sorted(set(safety_warnings)),
                  "status": status,
                  "knowledge_version": knowledge_version,
              }

              lines = ["## 需求理解", md(normalized["summary"] or "已根据活动背景检索现有策略和标签资料。")]
              if not catalog:
                  lines.extend(["", "> 当前未召回可校验的 CF 标签记录，请检查标签知识库绑定及记录格式。"])
              if not strategy_allowed:
                  lines.extend(["", "> 当前未召回可校验的场景策略 CF 清单，请检查策略知识库绑定及召回结果。"])
              if strategy_allowed and str(strategy_review_status or "").upper() != "APPROVED":
                  lines.extend(["", "> 当前业务策略尚未完成审批，本轮结果只能作为“配置前请确认”的建议。"])
              for index, audience in enumerate(normalized_audiences, 1):
                  lines.extend(["", "## " + str(index) + ". " + md(audience["name"]), md(audience["positioning"])])
                  if audience["reason"]:
                      lines.append("- 推荐理由：" + md(audience["reason"]))
                  lines.append("- CDP 配置条件：")
                  for condition in audience["conditions"]:
                      state_label = "已确认可配置" if condition["status"] == "CONFIRMED" else "配置前请确认"
                      use_label = "排除" if condition["use"] == "exclude" else "满足"
                      detail = condition["logic"] + "｜" + use_label + "｜" + md(condition["name"]) + "（" + md(condition["cf_id"]) + "）"
                      detail += "｜" + md(condition["operator"]) + "｜" + display_value(condition["value"])
                      lines.append("  - " + detail + "｜" + state_label)
                      if condition["path"]:
                          lines.append("    - 查找路径：" + md(condition["path"]))
                      if condition["source"]:
                          lines.append("    - 资料来源：" + md(condition["source"]))
                      if condition["configuration_guidance"]:
                          lines.append("    - 配置说明：" + md(condition["configuration_guidance"]))
                      if condition["missing_metadata"]:
                          lines.append("    - 缺少可确认元数据：" + "、".join(condition["missing_metadata"]))
                      if condition["time_window"]:
                          lines.append("    - 时间窗口：" + md(condition["time_window"]))
                      if condition["aggregation"]:
                          lines.append("    - 聚合方式：" + md(condition["aggregation"]))
                      if condition["reason"]:
                          lines.append("    - 选择原因：" + md(condition["reason"]))

              if pending_count:
                  lines.extend(["", "## 配置前请确认", "- 存在 " + str(pending_count) + " 个标签条件需要在当前 CDP 账号中核实后再配置。"])
              if gaps:
                  lines.extend(["", "## 标签能力缺口"])
                  lines.extend("- " + md(item) for item in sorted(set(gaps)))
              if normalized["notes"]:
                  lines.extend(["", "## 业务注意事项"])
                  lines.extend("- " + md(item) for item in normalized["notes"][:10])
              if normalized["safety_warnings"]:
                  lines.extend(["", "## 输出校验提醒"])
                  lines.extend("- " + md(item) for item in normalized["safety_warnings"])
              if knowledge_version:
                  lines.extend(["", "- 标签知识版本：" + md(knowledge_version)])
              lines.extend(["", "> 本结果未计算人数、未自动建群、未自动触达；请业务人员在 CDP 中逐项复核后人工配置。"])

              normalized_json = json.dumps(normalized, ensure_ascii=False)
              previous_object = load_plan(previous_plan)
              previous_json = json.dumps(previous_object, ensure_ascii=False) if previous_object else "{}"
              if status == "UNSUPPORTED":
                  plan_to_save = "{}" if str(intent or "").upper() == "NEW_PLAN" else previous_json
              else:
                  plan_to_save = normalized_json

              return {
                  "status": status,
                  "display_markdown": "\n".join(lines),
                  "normalized_plan_json": normalized_json,
                  "plan_to_save": plan_to_save,
                  "knowledge_version": knowledge_version,
                  "confirmed_count": confirmed_count,
                  "pending_count": pending_count,
              }

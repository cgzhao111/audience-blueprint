    - data:
        code: |
          import json
          import re

          CODE_KEYWORDS = {
              "BRAND_PROMOTION": ("品牌促销", "品牌活动", "品牌营销", "促销活动"),
              "DORMANT_RECALL": ("休眠召回", "休眠会员", "沉睡会员", "会员召回"),
              "REGISTERED_NO_PURCHASE": ("注册未消费", "注册未购买", "首单转化", "新客转化"),
              "STORE_OPENING": ("门店开业", "新店开业", "开业引流"),
              "CART_RECOVERY": ("购物车挽回", "弃购召回", "加购未购买", "加购召回"),
          }

          def flatten_text(value):
              if value is None:
                  return ""
              if isinstance(value, str):
                  return value
              if isinstance(value, dict):
                  preferred = []
                  for key in ("document_name", "title", "name", "content", "text"):
                      if key in value:
                          preferred.append(flatten_text(value.get(key)))
                  if preferred:
                      return "\n".join(preferred)
                  return "\n".join(flatten_text(item) for item in value.values())
              if isinstance(value, (list, tuple)):
                  return "\n".join(flatten_text(item) for item in value)
              return str(value)

          def documents(value):
              if isinstance(value, list):
                  return [flatten_text(item) for item in value if flatten_text(item).strip()]
              return [flatten_text(value)] if flatten_text(value).strip() else []

          def context_scenario(value):
              try:
                  parsed = json.loads(value) if isinstance(value, str) else value
              except Exception:
                  parsed = {}
              scenario = str((parsed or {}).get("scenario") or "").strip()
              upper = scenario.upper()
              if upper in CODE_KEYWORDS:
                  return upper
              for code, keywords in CODE_KEYWORDS.items():
                  if any(keyword in scenario for keyword in keywords):
                      return code
              return ""

          def detect_code(text):
              match = re.search(r"场景代码\s*[:：]\s*`?([A-Z_]+)`?", text, flags=re.I)
              if match:
                  return match.group(1).upper()
              hints = {
                  "COMMON": ("00通用规则", "通用规则"),
                  "BRAND_PROMOTION": ("01品牌促销", "品牌促销"),
                  "DORMANT_RECALL": ("02休眠召回", "休眠召回"),
                  "REGISTERED_NO_PURCHASE": ("03注册未消费", "注册未消费"),
                  "STORE_OPENING": ("04门店开业", "门店开业"),
                  "CART_RECOVERY": ("05购物车挽回", "购物车挽回", "弃购召回"),
              }
              for code, keywords in hints.items():
                  if any(keyword in text for keyword in keywords):
                      return code
              return ""

          def split_by_scene(text):
              markers = list(re.finditer(r"场景代码\s*[:：]\s*`?([A-Z_]+)`?", text, flags=re.I))
              if len(markers) <= 1:
                  return [(detect_code(text), text)]
              result = []
              for index, marker in enumerate(markers):
                  start = marker.start()
                  end = markers[index + 1].start() if index + 1 < len(markers) else len(text)
                  result.append((marker.group(1).upper(), text[start:end]))
              return result

          def allowed_section(text):
              match = re.search(r"(?is)##\s*允许引用的标签\s*(.*?)(?=\n##\s|\Z)", text)
              return match.group(1).strip() if match else ""

          def extract_cf_ids(text):
              ids = set(re.findall(r"\bCF-\d{3}\b", text.upper()))
              ranges = re.findall(r"CF-(\d{3})\s*(?:至|到|~|～|—|–)\s*CF-(\d{3})", text.upper())
              for start, end in ranges:
                  first, last = int(start), int(end)
                  if 1 <= first <= last <= 999 and last - first <= 100:
                      ids.update("CF-" + str(number).zfill(3) for number in range(first, last + 1))
              return ids

          def main(strategy_hits, activity_context):
              target_code = context_scenario(activity_context)
              sections = []
              for document in documents(strategy_hits):
                  sections.extend(split_by_scene(document))

              target_parts = [text for code, text in sections if code == target_code]
              common_parts = [text for code, text in sections if code == "COMMON"]
              if not target_code:
                  notice = "活动场景无法映射到已支持策略代码"
                  selected = []
              elif not target_parts:
                  notice = "本轮未召回与 " + target_code + " 对应的完整策略片段"
                  selected = []
              else:
                  notice = ""
                  selected = common_parts + target_parts

              allowed = set()
              for text in selected:
                  section = allowed_section(text)
                  if section:
                      allowed.update(extract_cf_ids(section))
              ordered = sorted(allowed, key=lambda item: int(item.split("-")[1]))
              if not ordered and not notice:
                  notice = "已召回策略，但未找到完整的‘允许引用的标签’段落"

              review_values = []
              versions = set()
              for text in selected:
                  review_match = re.search(r"审核状态\s*[:：]\s*([^\n]+)", text, flags=re.I)
                  if review_match:
                      review_values.append(review_match.group(1).strip(" `>"))
                  version_match = re.search(r"知识版本\s*[:：]\s*`?([^`\s]+)`?", text, flags=re.I)
                  if version_match:
                      versions.add(version_match.group(1).strip())
              approved_review_values = {"APPROVED", "已审批", "审核通过"}
              strategy_review_status = "APPROVED" if review_values and all(
                  (value.upper() if re.fullmatch(r"[A-Za-z_]+", value) else value) in approved_review_values
                  for value in review_values
              ) else "NEEDS_CONFIRMATION"

              return {
                  "strategy_status": "READY" if ordered else "UNSUPPORTED",
                  "scenario_code": target_code,
                  "allowed_cf_ids": ",".join(ordered),
                  "tag_query": " ".join(ordered) if ordered else "__NO_SUPPORTED_CF__",
                  "selected_strategy_text": "\n\n".join(selected)[:12000],
                  "strategy_notice": notice,
                  "strategy_review_status": strategy_review_status,
                  "strategy_version": ",".join(sorted(versions)),
              }
        code_language: python3
        desc: 按明确活动场景选择目标策略与通用策略，只展开“允许引用的标签”段落并生成精确标签查询词
        outputs:

    - data:
        code: |
          import re

          PATTERNS = (
              r"(?<!\d)1[3-9]\d{9}(?!\d)",
              r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}",
              r"(?<!\d)[1-9]\d{5}(?:19|20)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])\d{3}[\dXx](?!\d)",
              r"(?i)(?:会员号|会员编号|会员\s*ID|member[_\s-]*id|open[_\s-]*id|openid|unionid)\s*[:：=]?\s*[A-Za-z0-9_-]{4,}",
          )

          def main(user_query):
              text = str(user_query or "")
              blocked = any(re.search(pattern, text) for pattern in PATTERNS)
              return {
                  "safe_gate": "PII_BLOCKED" if blocked else "CLEAR",
                  "safe_notice": "请删除手机号、邮箱、证件号、会员号、会员ID、openid等用户标识后，再描述营销目标。" if blocked else "",
              }
        code_language: python3
        desc: 在任何模型调用前检查手机号、邮箱、身份证和显式用户标识；不输出或保存原始输入
